# Reverse Proxy: portainer.gfn.internal -> Portainer-Container (HTTP-Port 9000)
# Voraussetzung: a2enmod proxy proxy_http
<VirtualHost *:80>
    ServerName portainer.gfn.internal

    ProxyPreserveHost On
    ProxyPass / http://localhost:9000/
    ProxyPassReverse / http://localhost:9000/

    ErrorLog /var/log/apache2/portainer-error.log
    CustomLog /var/log/apache2/portainer-access.log combined
</VirtualHost>
